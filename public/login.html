<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Downloader">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Downloader</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e8eaf0; --dim:#8b92a3; --accent:#5b9dff; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { touch-action: manipulation; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;
         padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width:360px; margin:0 auto; padding-top:15vh; }
  h1 { font-size:22px; margin:0 0 16px; }
  form { display:grid; gap:10px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:16px; }
  button { padding:12px 16px; border-radius:10px; border:0; background:var(--accent); color:#fff; font-size:16px; font-weight:600; }
  .err { color:var(--bad); font-size:14px; margin-top:10px; min-height:20px; }
</style>
</head>
<body>
<main>
  <h1>Background downloader</h1>
  <form id="f">
    <input type="text" name="username" value="downloader" autocomplete="username" hidden>
    <input id="pw" type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
    <button type="submit">Log in</button>
  </form>
  <div id="err" class="err"></div>
</main>
<script>
document.querySelector('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.querySelector('#err');
  err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.querySelector('#pw').value }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || 'Login failed');
    location.href = '/';
  } catch (ex) {
    err.textContent = ex.message;
  }
});
</script>
</body>
</html>
