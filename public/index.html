<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Downloader">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>Downloader</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e8eaf0; --dim:#8b92a3; --accent:#5b9dff; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#f5b84b; }
  * { box-sizing: border-box; }
  html, body { touch-action: manipulation; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;
         padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width:640px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; margin:4px 0 4px; }
  h1 { font-size:20px; margin:0; }
  .linkbtn { background:none; color:var(--dim); font-size:14px; font-weight:400; padding:6px 0 6px 12px; border-radius:0; }
  .disk { color:var(--dim); font-size:13px; margin-bottom:16px; }
  .disk.warn { color:var(--warn); }
  form { display:grid; gap:8px; margin-bottom:20px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:16px; }
  button { padding:12px 16px; border-radius:10px; border:0; background:var(--accent); color:#fff; font-size:16px; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .name { font-weight:600; word-break:break-all; }
  .meta { color:var(--dim); font-size:13px; margin-top:4px; }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin:10px 0 4px; }
  .bar > div { height:100%; background:var(--accent); transition:width .5s; }
  .bar.done > div { background:var(--ok); }
  .bar.indeterminate > div { width:30% !important; animation:slide 1.2s infinite linear; }
  @keyframes slide { from { margin-left:-30%; } to { margin-left:100%; } }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .row button, .row a { padding:8px 12px; font-size:14px; background:var(--line); color:var(--text); border-radius:8px; text-decoration:none; border:0; }
  .row a.primary { background:var(--ok); color:#06210f; font-weight:600; }
  .err { color:var(--bad); font-size:13px; margin-top:4px; }
  .empty { color:var(--dim); text-align:center; padding:30px 0; }
  .picker .row { margin-top:6px; }
  .picker .row button { width:100%; text-align:left; word-break:break-all; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Background downloader</h1>
    <button class="linkbtn" id="logout" type="button">Log out</button>
  </header>
  <div class="disk" id="disk"></div>
  <form id="f">
    <input id="url" type="url" placeholder="Paste a link (file, GitHub repo, Dropbox, Drive…)" required autocomplete="off">
    <input id="fn" type="text" placeholder="Filename (optional)" autocomplete="off">
    <input id="conn" type="number" min="1" max="32" inputmode="numeric" placeholder="Connections (default 8)">
    <button type="submit">Start download</button>
  </form>
  <div id="picker"></div>
  <div id="list"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const fmt = (n) => {
  if (n == null) return '?';
  const u = ['B','KB','MB','GB','TB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i > 1 ? 2 : 0) + ' ' + u[i];
};
const eta = (j) => {
  if (!j.speed || !j.total) return '';
  const s = Math.round((j.total - j.received) / j.speed);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return ' · ' + (h ? h + 'h ' : '') + m + 'm left';
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = '/'; throw new Error('Not logged in'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function render(jobs) {
  if (!jobs.length) { $('#list').innerHTML = '<div class="empty">No downloads yet</div>'; return; }
  $('#list').innerHTML = jobs.map((j) => {
    const pct = j.total ? Math.min(100, (j.received / j.total) * 100) : 0;
    const barCls = j.status === 'done' ? 'done' : (!j.total && j.status === 'downloading' ? 'indeterminate' : '');
    let status = j.status;
    if (j.status === 'downloading') status = `${fmt(j.speed)}/s${eta(j)}${j.mode === 'segmented' ? ' · ' + j.connections + 'x' : ''}`;
    if (j.status === 'queued' && j.error) status = 'retrying…';
    let btns = '';
    if (j.status === 'done') btns += `<a class="primary" href="/files/${j.id}">Download file</a>`;
    if (j.status === 'downloading' || j.status === 'queued') btns += `<button onclick="act('${j.id}','pause')">Pause</button>`;
    if (j.status === 'paused' || j.status === 'failed') btns += `<button onclick="act('${j.id}','resume')">Resume</button>`;
    btns += `<button onclick="del('${j.id}')">Remove</button>`;
    return `<div class="card">
      <div class="name">${esc(j.filename)}</div>
      <div class="bar ${barCls}"><div style="width:${j.status === 'done' ? 100 : pct}%"></div></div>
      <div class="meta">${fmt(j.received)} / ${fmt(j.total)}${j.total ? ' (' + pct.toFixed(1) + '%)' : ''} · ${esc(status)}</div>
      ${j.error && j.status !== 'done' ? `<div class="err">${esc(j.error)}</div>` : ''}
      <div class="row">${btns}</div>
    </div>`;
  }).join('');
}

function renderDisk(st) {
  const el = $('#disk');
  if (!st || !st.total) { el.textContent = ''; return; }
  el.textContent = `Storage: ${fmt(st.free)} free of ${fmt(st.total)}`;
  el.classList.toggle('warn', st.free / st.total < 0.1);
}

function updateTitle(jobs) {
  const active = jobs.filter((j) => j.status === 'downloading');
  const speed = active.reduce((a, j) => a + (j.speed || 0), 0);
  document.title = active.length ? `↓ ${active.length} · ${fmt(speed)}/s` : 'Downloader';
}

async function refresh() {
  try {
    const [jobs, st] = await Promise.all([api('/api/jobs'), api('/api/stats')]);
    render(jobs); renderDisk(st); updateTitle(jobs);
  } catch {}
}
async function act(id, a) { await api(`/api/jobs/${id}/${a}`, 'POST'); refresh(); }
async function del(id) { if (confirm('Remove this download and delete the file?')) { await api(`/api/jobs/${id}`, 'DELETE'); refresh(); } }

let pickerChoices = [];
let pickerConn;
function closePicker() { $('#picker').innerHTML = ''; pickerChoices = []; }
function showPicker(title, choices, conn) {
  pickerChoices = choices; pickerConn = conn;
  $('#picker').innerHTML = `<div class="card picker">
    <div class="name">${esc(title || 'Pick a file')}</div>
    <div class="meta">This link has more than one file. Pick one:</div>
    ${choices.map((c, i) => `<div class="row"><button onclick="pick(${i})">${esc(c.name)}${c.size ? ' · ' + fmt(c.size) : ''}</button></div>`).join('')}
    <div class="row"><button onclick="closePicker()">Cancel</button></div>
  </div>`;
}
async function pick(i) {
  const c = pickerChoices[i];
  try {
    await api('/api/jobs', 'POST', { url: c.url, direct: true, connections: pickerConn });
    closePicker(); $('#url').value = ''; $('#fn').value = '';
    refresh();
  } catch (err) { alert(err.message); }
}

$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#f button[type=submit]');
  btn.disabled = true; btn.textContent = 'Checking link…';
  try {
    const conn = $('#conn').value ? parseInt($('#conn').value, 10) : undefined;
    const out = await api('/api/jobs', 'POST', { url: $('#url').value, filename: $('#fn').value || undefined, connections: conn });
    if (out.choices) { showPicker(out.title, out.choices, conn); return; }
    closePicker(); $('#url').value = ''; $('#fn').value = '';
    refresh();
  } catch (err) { alert(err.message); }
  finally { btn.disabled = false; btn.textContent = 'Start download'; }
});

$('#logout').addEventListener('click', async () => {
  try { await api('/api/logout', 'POST'); } catch {}
  location.href = '/';
});

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 2000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
